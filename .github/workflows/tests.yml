name: application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.4
        env:
          MYSQL_DATABASE: umdts_testing
          MYSQL_USER: umdts_test
          MYSQL_PASSWORD: disposable-ci-password
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: umdts_testing
      DB_USERNAME: umdts_test
      DB_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, dom
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Configure disposable database and key
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: php artisan test
